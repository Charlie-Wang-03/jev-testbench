name: ci

# Every check in this workflow is offline. It reads the committed canonical logs, regenerates the
# derived views from them, and runs a test suite that blocks sockets outright. No repository secret
# is referenced anywhere below, so a pull request that accidentally reached for the network fails
# here instead of spending money against a real TypeSafe account.
#
# This is the first gate that runs somewhere other than the machine the measurements were taken on.
# That matters for exactly one class of failure: a test that quietly depends on Windows. None is
# known to, but the suite has only ever been run on Windows so far.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. The job checks out, installs, and runs; it never writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete. Cancelling is free here because
# nothing is being measured -- contrast the experiment modules, where a cancelled call is lost data.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The loader reads TYPESAFE_API_KEY from the environment when the value is non-blank. It is
      # set empty here so that this job is credential-free by construction rather than by omission.
      # Nothing depends on it: conftest.py redirects the secret-file loader and blocks sockets.
      TYPESAFE_API_KEY: ""
    steps:
      # Tags, not commit SHAs. A tag is mutable, so this is the weaker of the two pinning styles;
      # pinning the SHAs would be the hardening step, and it is worth doing once these versions
      # are settled.
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test, offline
        run: uv run --no-sync pytest

      - name: Build the distribution
        run: uv build

      - name: Regenerate the derived reports from the canonical logs
        run: |
          uv run --no-sync python -m jev_lab report
          uv run --no-sync python -m jev_lab snapshot
          uv run --no-sync python -m jev_lab final-report

      # The claims that `JEV_LOCAL_EVALUATION_FINAL.md` is a derived view and that the derived views
      # cannot drift from the log are enforced here rather than promised in a docstring. A code
      # change that silently altered the published report would surface as a diff in this step.
      - name: The committed derived report must match a fresh regeneration
        run: git diff --exit-code -- results/JEV_LOCAL_EVALUATION_FINAL.md
