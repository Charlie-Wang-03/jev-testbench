name: ci

# Every check in this workflow is offline. It reads the committed canonical logs, regenerates the
# derived views from them, and runs a test suite that blocks sockets outright. No repository secret
# is referenced anywhere below, so a pull request that accidentally reached for the network fails
# here instead of spending money against a real TypeSafe account.
#
# This is the first gate that runs somewhere other than the machine the measurements were taken on.
# That matters for exactly one class of failure: a test that quietly depends on Windows. None is
# known to, but the suite has only ever been run on Windows so far.

on:
  push:
    # `main` is the promoted branch. `release/**` is here so a release branch is verified at its own
    # exact SHA before it is fast-forwarded onto `main`, rather than only after promotion. A
    # `pull_request` trigger would not serve that purpose: it checks out the synthetic merge commit,
    # so it would verify a tree that is never published. `workflow_dispatch` is unavailable until
    # this file first reaches the default branch, which is why the push trigger is the one that has
    # to work on the first run.
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

# Read-only. The job checks out, installs, and runs; it never writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete. Cancelling is free here because
# nothing is being measured -- contrast the experiment modules, where a cancelled call is lost data.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The loader reads TYPESAFE_API_KEY from the environment when the value is non-blank. It is
      # set empty here so that this job is credential-free by construction rather than by omission.
      # Nothing depends on it: conftest.py redirects the secret-file loader and blocks sockets.
      TYPESAFE_API_KEY: ""
    steps:
      # Pinned to commit SHAs, with the human-readable version in the comment. A tag is mutable: the
      # tag that resolved to this code today can be moved to different code tomorrow, and whoever
      # moves it would be running in this job. Both SHAs were read from the actions' own
      # repositories -- `actions/checkout` v6 is a lightweight tag on a commit, `astral-sh/setup-uv`
      # v6 is an annotated tag, and the SHA below is the commit it dereferences to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test, offline
        run: uv run --no-sync pytest

      - name: Build the distribution
        run: uv build

      - name: Regenerate the derived reports from the canonical logs
        run: |
          uv run --no-sync python -m jev_lab report
          uv run --no-sync python -m jev_lab snapshot
          uv run --no-sync python -m jev_lab final-report

      # The claims that `JEV_LOCAL_EVALUATION_FINAL.md` is a derived view and that the derived views
      # cannot drift from the log are enforced here rather than promised in a docstring. A code
      # change that silently altered the published report would surface as a diff in this step.
      - name: The committed derived report must match a fresh regeneration
        run: git diff --exit-code -- results/JEV_LOCAL_EVALUATION_FINAL.md

      # The release freeze, checked rather than trusted. This recomputes the SHA-256 of every file
      # `docs/evidence/v0.1.0/evidence-manifest.json` lists, re-counts both canonical logs, and
      # re-checks the registry, licence, version and P3-verdict invariants -- offline, with no key.
      #
      # What this step is for: `v0.1.0` is a published, citable release whose whole value is that its
      # numbers do not move. Without this gate, editing a canonical log, an audit or the
      # preregistration on `main` would break no build and invalidate every citation silently. With
      # it, such an edit fails here until a *new versioned* freeze is created for it. The fix for a
      # red run is never to edit `docs/evidence/v0.1.0/` to match.
      - name: Verify the frozen evidence manifest
        run: uv run --no-sync python -m jev_lab.evidence_freeze verify
