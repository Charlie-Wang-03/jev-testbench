[project]
name = "jev-testbench"
# The version lifecycle, which the numbers alone do not explain:
#
#   0.1.0     the frozen evidence release, tagged `v0.1.0`. It was published under the project's
#             historical name, `jev-test`. That release is immutable and this file on `main` has no
#             bearing on it -- the tag carries its own copy.
#   0.1.1.dev0 development identity after that freeze: project identity, presentation and process
#             documentation. It contains no new measurement and must never be tagged as a release;
#             it exists so that "post-freeze" and "the release" are distinguishable at a glance.
#   0.2.0     reserved for genuinely new scientific evidence.
version = "0.1.1.dev0"
# The word "benchmark" is avoided on purpose: this repository has no ground truth, so it does not
# produce an accuracy score, which is what the word promises. What it produces is a log and a set
# of labelled claims about that log.
description = "An auditable measurement bench for TypeSafe Jev: one append-only log record per real API call, and every claim labelled by kind."
readme = "README.md"
authors = [
    { name = "Yichuan Wang", email = "133667618+Charlie-Wang-03@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "typesafe",
    "jev",
    "llm",
    "probabilistic-decision",
    "evaluation",
    "reproducibility",
    "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# MIT, chosen by the copyright holder and recorded in docs/OPEN_SOURCE_LICENSE_DECISION.md. This is
# the PEP 639 form: an SPDX expression in `license` plus `license-files`, which writes
# `License-Expression: MIT` and `License-File: LICENSE` into the core metadata.
#
# No `License :: OSI Approved :: MIT License` classifier. PEP 639 deprecates the `License ::`
# classifiers once an SPDX expression is present, and shipping both states the same term twice in
# two vocabularies -- exactly the kind of duplication that drifts. The expression is the one that
# is machine-checked; `tests/test_docs_consistency.py` asserts the file and the metadata agree.
#
# No `py.typed` marker either, and therefore no `Typing :: Typed` classifier. The supported
# interface is the CLI and the evidence files it writes, not `import jev_lab`; advertising the
# modules as a typed library would promise a stability this package does not offer.
dependencies = [
    "typesafe-sdk>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/Charlie-Wang-03/jev-testbench"
Repository = "https://github.com/Charlie-Wang-03/jev-testbench"
Issues = "https://github.com/Charlie-Wang-03/jev-testbench/issues"
Documentation = "https://github.com/Charlie-Wang-03/jev-testbench/blob/main/docs/README.md"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is named `jev-testbench`, but the import package stays `jev_lab` -- unchanged
# by the project rename, because the supported interface is the CLI and the evidence files it
# writes, not `import jev_lab`. Left unset, the backend looks for a module matching the *project*
# name (`src/jev_testbench/`) and the build fails.
module-name = "jev_lab"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # The same linter CI runs, installed here so `uv run ruff check .` is what a contributor and
    # the workflow both execute. Exact versions come from uv.lock.
    "ruff>=0.16.8",
]

[tool.ruff]
# `ruff format` is deliberately not adopted. Much of this codebase's prose is built by implicit
# string concatenation across lines, and running the formatter once rewrote that idiom wholesale:
# 3,249 insertions and 1,016 deletions across 29 of 39 files, at line-length 100 and 110 and 120
# alike, so the churn is structural rather than a width setting. That diff would land across the
# measurement modules with no behavioural change to show for it. A narrow check set is enforced
# instead.
target-version = "py313"

[tool.ruff.lint]
# E4/E7/E9 (import and statement-level errors), F (pyflakes), I (import order).
#
# Not the default rule set: `ISC004` alone fires 163 times here, and every one of those is this
# codebase's deliberate multi-line string building. Enabling it would mean either 163 `# noqa`
# comments or rewriting prose that carries the argument. A gate that forces a choice between noise
# and suppression is not a gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# Only `tests/` is collected. Scoping it here is what keeps a stray scratch script at the repo
# root from being imported by pytest -- unit tests in this repo must never reach the live API.
testpaths = ["tests"]
# A project-local basetemp keeps the suite runnable where the system %TEMP% is not writable.
addopts = "-q --basetemp=.pytest-tmp"
